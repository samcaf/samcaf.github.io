<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- bound state: three colour-charged quarks held by curly gluon springs -->
  <circle cx="32" cy="32" r="30" stroke="#8b9dff" stroke-width="1.2" opacity="0.30"/>
  <g stroke="#9aa0b5" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <g transform="rotate(-90 32 32)"><path d="M38,32 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0"/></g>
    <g transform="rotate(30 32 32)"><path d="M38,32 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0"/></g>
    <g transform="rotate(150 32 32)"><path d="M38,32 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0 a2.3,4.2 0 1,1 4,0"/></g>
  </g>
  <!-- quarks (r / g / b colour charge) -->
  <g transform="rotate(-90 32 32)"><circle cx="53" cy="32" r="8" fill="#d98c96" opacity="0.22"/><circle cx="53" cy="32" r="5.6" fill="#d98c96"/></g>
  <g transform="rotate(30 32 32)"><circle cx="53" cy="32" r="8" fill="#93c6a3" opacity="0.22"/><circle cx="53" cy="32" r="5.6" fill="#93c6a3"/></g>
  <g transform="rotate(150 32 32)"><circle cx="53" cy="32" r="8" fill="#93b3de" opacity="0.22"/><circle cx="53" cy="32" r="5.6" fill="#93b3de"/></g>
  <!-- bound-state core -->
  <circle cx="32" cy="32" r="3.4" fill="#8b9dff"/>
</svg>
